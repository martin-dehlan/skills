# Strict analyzer config. Merge into the app's analysis_options.yaml.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    unused_import: warning
    unused_local_variable: warning
    unused_element: warning
    unused_field: warning
    dead_code: warning
    missing_required_param: error
    missing_return: error
    invalid_annotation_target: ignore   # freezed + json_serializable
    # An analytics or sync call that is not awaited must be a visible decision (unawaited(...)).
    unawaited_futures: warning
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"
    - android/**
    - ios/**

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - unawaited_futures
    - use_super_parameters
