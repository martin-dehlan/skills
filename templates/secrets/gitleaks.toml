# gitleaks config. Runs in the pre-commit hook (scripts/git-hooks/pre-commit),
# in CI (.github/workflows/secret-scan.yml) and in scripts/check_secrets.sh.
title = "app gitleaks config"

# Built-in rules: Google/Firebase, AWS, GitHub, Slack, JWTs, private keys, generic keys, …
[extend]
useDefault = true

# Supabase secret keys (new format). The publishable key (sb_publishable_…) may ship in the app.
[[rules]]
id = "supabase-secret-key"
description = "Supabase secret / service key"
regex = '''sb_secret_[A-Za-z0-9_-]{20,}'''
keywords = ["sb_secret_"]

# Legacy Supabase service_role JWT: the payload carries "role":"service_role".
[[rules]]
id = "supabase-service-role-jwt"
description = "Supabase service_role JWT"
regex = '''eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]*c2VydmljZV9yb2xl[A-Za-z0-9_-]*\.[A-Za-z0-9_-]+'''
keywords = ["eyJ"]

# Resend API keys.
[[rules]]
id = "resend-api-key"
description = "Resend API key"
regex = '''re_[A-Za-z0-9]{8,}_[A-Za-z0-9]{16,}'''
keywords = ["re_"]

# Allowlist: narrow paths and exact regexes only, each with a reason.
[allowlist]
description = "Placeholders, templates, lockfile checksums"
paths = [
  '''\.example$''',
  '''\.template(\.dart)?$''',
  '''ios/Podfile\.lock$''',   # SPEC CHECKSUMS are SHA-1s, not secrets
  '''pubspec\.lock$''',
]
regexes = [
  '''PLACEHOLDER''',
  '''your[-_]?(api[-_]?)?key[-_]?here''',
]
