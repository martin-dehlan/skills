name: secret-scan

# Backstop for the pre-commit hook: catches pushes from clones that never
# installed it. A red job blocks the merge.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No pull-requests scope needed: the scan below runs the gitleaks binary itself
# instead of gitleaks-action, which listed the PR's commits through the API.
permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0   # full history of the PR range
      - name: install gitleaks (checksum verified)
        run: |
          v=8.30.1
          f="gitleaks_${v}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v$v/$f"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xz -C "$RUNNER_TEMP" -f "$RUNNER_TEMP/$f" gitleaks
      - name: secret hygiene (tracked files, .gitignore, PR range)
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: PATH="$RUNNER_TEMP:$PATH" bash scripts/check_secrets.sh $BASE
