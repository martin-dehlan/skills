name: secret-scan

# Backstop for the pre-commit hook: catches pushes from clones that never
# installed it. A red job blocks the merge.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# pull-requests: read is required: gitleaks-action lists the PR's commits,
# and without it the call 403s and the job fails before scanning anything.
permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pin both actions to a commit SHA in the app (Dependabot keeps them current).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history of the PR range
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: 'false'
      - name: secret hygiene (tracked files, .gitignore, PR range)
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          PATH="$RUNNER_TEMP:$PATH" bash scripts/check_secrets.sh $BASE
